# Configuration for the BankMemberMenu.
# This menu shows all bank members as player heads and allows kicking or role changes.

menu:
  title: "<yellow>Manage Members</yellow>"
  rows: 6
  refresh-interval: "1"

layout:
  slots:
    info: 4
    back: 49

  members:
    bounds:
      x: 1
      y: 2
      width: 7
      height: 3
      alignment: "LEFT"

    navigation:
      previous-slot: 45
      next-slot: 53
      show-current-page-amount: true
      hide-previous-on-first-page: true
      hide-next-on-last-page: true

extra-items: []

items:
  fill:
    item: "minecraft:black_stained_glass_pane"
    display-name: " "
    lore: []

  info:
    item: "minecraft:paper"
    display-name: "<dark_gray>» <yellow>Manage Members</yellow>"
    lore:
      - ""
      - "<yellow>│ <gray>Bank: <yellow><bank-name></yellow>"
      - "<yellow>│ <gray>Owner: <yellow><owner-name></yellow>"
      - "<yellow>│ <gray>Members: <yellow><member-count></yellow>"
      - ""
      - "<dark_gray>Left click: change role | Right click: kick</dark_gray>"

  empty:
    item: "minecraft:barrier"
    display-name: "<red>No members available</red>"
    lore:
      - ""
      - "<dark_gray>This bank currently has no members to manage.</dark_gray>"
      - "<dark_gray>Add members first or come back later.</dark_gray>"

  member-entry:
    item: "minecraft:player_head"
    display-name: "<dark_gray>» <yellow><member-name></yellow>"
    lore:
      - ""
      - "<yellow>│ <gray>UUID: <yellow><member-uuid></yellow>"
      - "<yellow>│ <gray>Role: <yellow><role-name></yellow>"
      - "<yellow>│ <gray>Priority: <yellow><priority></yellow>"
      - "<yellow>│ <gray>Deposit: <green><can-deposit></green>"
      - "<yellow>│ <gray>Withdraw: <green><can-withdraw></green>"
      - "<yellow>│ <gray>Invite: <green><can-invite></green>"
      - "<yellow>│ <gray>Kick: <green><can-kick></green>"
      - ""
      - "<dark_gray>Left click to change the role</dark_gray>"
      - "<dark_gray>Right click to kick</dark_gray>"

  navigation:
    previous:
      item: "minecraft:arrow"
      display-name: "<yellow>Previous Page</yellow>"
      lore: []
    next:
      item: "minecraft:arrow"
      display-name: "<yellow>Next Page</yellow>"
      lore: []

  back:
    item: "minecraft:arrow"
    display-name: "<yellow>Back</yellow>"
    lore:
      - ""
      - "<dark_gray>Return to bank details</dark_gray>"

