# Configuration for the "Vault Bridge" module, which integrates with external plugins or services.
vault-bridge:
  # Enables or disables the Vault Bridge functionality.
  enabled: true

# Configuration for the leaderboard module.
leaderboard:
  # The time-to-live (TTL) for any leaderboard placeholder, in seconds.
  ttl-seconds: 30

# Configuration for the bank account cache (balance + members per bank account).
bank-cache:
  # TTL is a safety net: even if an invalidation is missed, stale entries will refresh in the background.
  # Set to 0 to disable TTL (cache only refreshes on explicit invalidation).
  ttl-seconds: 30
  # Maximum number of cached bank accounts.
  max-entries: 10000
  # How many entries to sample per cleanup run. Higher = more accurate eviction, more CPU.
  cleanup-batch: 512

# Configuration for the bank module.
bank:
  # Maximum number of banks per player can have membership in.
  max-other-banks: 10
  # Inventory click effects for the bank GUI.
  # Each effect is triggered by a specific click action and can have multiple effects (e.g. play sound, send message, etc.).
  inventory-effects:

    general-click:
      - id: play-sound
        args:
          sound: "minecraft:block.wooden_button.click_on"
          volume: 1
          pitch: 1.5

    bank-upgrade-success:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.pling"
          volume: 1
          pitch: 1.5

    bank-upgrade-fail:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.bass"
          volume: 1
          pitch: 0.5

    deposit-success:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.chime"
          volume: 1
          pitch: 1.5

    deposit-fail:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.bass"
          volume: 1
          pitch: 0.5

    withdraw-success:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.xylophone"
          volume: 1
          pitch: 1.5

    withdraw-fail:
      - id: play-sound
        args:
          sound: "minecraft:block.note_block.bass"
          volume: 1
          pitch: 0.5

