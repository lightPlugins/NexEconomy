# ######################################################  #
#                    LANGUAGE SETTINGS                     #
# ######################################################  #
# Here you can manage the general settings for the core plugin.
language: english

# ######################################################  #
#                     LOGGING SYSTEM                      #
# ######################################################  #
# The Debug Logging system for the core plugin
# You can enable or disable the debug logging system
# and set the debug level.
logging:
  debug:
    enable: false
    level: 3

# ######################################################  #
#                  CROSS-SERVER SETTINGS                  #
# ######################################################  #
# This name identifies this server in a multi-server /
# cross-server environment. It is sent along with Redis
# messages so that NexEconomy can ignore its own messages
# and avoid critical echo loops.
cross-server:
  servername: 'survival'