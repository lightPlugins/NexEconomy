# The currency name overall
# HINT: If you create a new currency,
#       you just need to use /nexeconomy reload to activate it.
name: 'Coins'
# Here you can define the symbol nor name
symbol:
  # The plural and singular form of the currency symbol
  # This is used in the placeholder -> <currency>
  plural: 'Coins'
  singular: 'Coin'
# The placeholder for placeholder API usage
placeholder: '<yellow>#name#: <yellow>#amount# <gray>#symbol#'
# The command to execute for this specific currency
command:
  # The main command
  main: 'my_command'
  # Aliases for the command,
  # For example, you can use /coin or /coins
  # IMPORTANT: This section needs a server restart to work!
  aliases:
    - 'some_alias'
# How many digits should be shown after the decimal point.
fraction-digits: 0
# The types of your currency:
# vault -> Vault integration (used in different shop plugins)
# virtual -> Virtual currency (no direct integration)
#
# IMPORTANT:
# - This section needs a server restart to work!
# - Use “Vault” only one time per a server!
currency-type: vault # virtual, vault
# The starting balance of the currency (if a player joins the server)
start-balance: 120
# The maximum balance of the currency
# If set to -1, there is no limit
# If a player has more coins than this limit, he is unable to gain more “coins”
max-balance: -1

